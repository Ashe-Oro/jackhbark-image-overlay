<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div id="button-container">
        <input type="file" id="upload" accept="image/*">
        <button id="save">Save Image</button>
        <button id="add-pirate-hat">Add Pirate Hat</button>
    </div>
    <div id="canvas-container">
        <canvas id="canvas" width="1000" height="1000"></canvas>
    </div>
</body>
<script>
let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
let pirateHatImg = new Image();
pirateHatImg.crossOrigin = "anonymous";  // Add this line
//pirateHatImg.src = './pirate-hat.png';
let uploadedImg = new Image();
let dragging = false;
let resizing = false;
let pirateHats = [
    { img: pirateHatImg, pos: { x: 0, y: 0 }, size: { width: 0, height: 0 }, dragging: false, resizing: false }
];
let uploadedImgDragging = false;
let uploadedImgResizing = false;
let mouseOffset = { x: 0, y: 0 };
let resizeCorner = null;
let uploadedImgPos = { x: 0, y: 0 };
let uploadedImgSize = { width: uploadedImg.width, height: uploadedImg.height };

pirateHatImg.onload = function() {
    pirateHats[0].size = { width: pirateHatImg.width, height: pirateHatImg.height };
    draw();
};
pirateHatImg.src = 'pirate-hat.png';

document.getElementById('upload').addEventListener('change', function(e) {
    var reader = new FileReader();
    reader.onload = function(event) {
        uploadedImg = new Image();
        uploadedImg.crossOrigin = "anonymous";
        uploadedImg.onload = function() {
            // Set the position and size of the uploaded image
            uploadedImgPos = { x: (canvas.width - uploadedImg.width) / 2, y: (canvas.height - uploadedImg.height) / 2 };
            uploadedImgSize = { width: uploadedImg.width, height: uploadedImg.height };

            // Draw the image at its position and size
            draw();
        }
        uploadedImg.src = event.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
});

document.getElementById('add-pirate-hat').addEventListener('click', function() {
    let newPirateHat = {
        img: new Image(),
        pos: { x: 50, y: 50 },
        size: { width: pirateHatImg.width, height: pirateHatImg.height },
        dragging: false,
        resizing: false
    };
    newPirateHat.img.crossOrigin = "anonymous";
    newPirateHat.img.src = 'pirate-hat.png';
    pirateHats.push(newPirateHat);
    draw();
});

function getMousePos(canvas, evt) {
    var rect = canvas.getBoundingClientRect();
    return {
        x: evt.clientX - rect.left,
        y: evt.clientY - rect.top
    };
}

function getCornerPos(rect, corner) {
    switch (corner) {
        case 'topLeft':
            return { x: rect.x, y: rect.y };
        case 'topRight':
            return { x: rect.x + rect.width, y: rect.y };
        case 'bottomLeft':
            return { x: rect.x, y: rect.y + rect.height };
        case 'bottomRight':
            return { x: rect.x + rect.width, y: rect.y + rect.height };
        default:
            return null;
    }
}

function distance(p1, p2) {
    var dx = p2.x - p1.x;
    var dy = p2.y - p1.y;
    return Math.sqrt(dx * dx + dy * dy);
}

function pointInRect(point, rect) {
    return point.x >= rect.x && point.y >= rect.y &&
           point.x <= rect.x + rect.width && point.y <= rect.y + rect.height;
}

canvas.addEventListener('mousedown', function(e) {
    var pos = getMousePos(canvas, e);
    var corners = ['topLeft', 'topRight', 'bottomLeft', 'bottomRight'];
    var cornerRadius = 5; // Radius of the circles at the corners
    let clickedOnHat = false;

    pirateHats.forEach((hat) => {
        var hatRect = {
            x: hat.pos.x,
            y: hat.pos.y,
            width: hat.size.width,
            height: hat.size.height
        };

        for (var i = 0; i < corners.length; i++) {
            var corner = corners[i];
            var cornerPos = getCornerPos(hatRect, corner);
            if (distance(pos, cornerPos) <= cornerRadius) {
                resizing = true;
                resizeCorner = corner;
                hat.resizing = true;
                clickedOnHat = true;
                return;
            }
        }

        if (pointInRect(pos, hatRect)) {
            dragging = true;
            hat.dragging = true;
            mouseOffset = { x: pos.x - hat.pos.x, y: pos.y - hat.pos.y };
            clickedOnHat = true;
        }
    });

    if (!clickedOnHat) {
        var uploadedImgRect = {
            x: uploadedImgPos.x,
            y: uploadedImgPos.y,
            width: uploadedImgSize.width,
            height: uploadedImgSize.height
        };

        for (var i = 0; i < corners.length; i++) {
            var corner = corners[i];
            var cornerPos = getCornerPos(uploadedImgRect, corner);
            if (distance(pos, cornerPos) <= cornerRadius) {
                uploadedImgResizing = true;
                resizeCorner = corner;
                return;
            }
        }

        if (pointInRect(pos, uploadedImgRect)) {
            uploadedImgDragging = true;
            mouseOffset = { x: pos.x - uploadedImgPos.x, y: pos.y - uploadedImgPos.y };
        }
    }
});

canvas.addEventListener('mouseup', function(e) {
    dragging = false;
    resizing = false;
    uploadedImgDragging = false;
    uploadedImgResizing = false;
    pirateHats.forEach(hat => {
        hat.dragging = false;
        hat.resizing = false;
    });
    resizeCorner = null;
});

canvas.addEventListener('mousemove', function(e) {
    var pos = getMousePos(canvas, e);
    var corners = ['topLeft', 'topRight', 'bottomLeft', 'bottomRight'];
    var cornerRadius = 5; // Radius of the circles at the corners

    pirateHats.forEach(hat => {
        if (hat.dragging) {
            hat.pos = { x: pos.x - mouseOffset.x, y: pos.y - mouseOffset.y };
        } else if (hat.resizing) {
            var dx = pos.x - hat.pos.x;
            var dy = pos.y - hat.pos.y;
            var originalRatio = pirateHatImg.width / pirateHatImg.height;

            switch (resizeCorner) {
                case 'topLeft':
                    hat.size.width -= dx;
                    hat.size.height = hat.size.width / originalRatio;
                    hat.pos.x += dx;
                    hat.pos.y += dy;
                    break;
                case 'topRight':
                    hat.size.width = dx;
                    hat.size.height = hat.size.width / originalRatio;
                    hat.pos.y += dy;
                    break;
                case 'bottomLeft':
                    hat.size.width -= dx;
                    hat.size.height = hat.size.width / originalRatio;
                    hat.pos.x += dx;
                    break;
                case 'bottomRight':
                    hat.size.width = dx;
                    hat.size.height = hat.size.width / originalRatio;
                    break;
            }
        }
    });

    if (uploadedImgDragging) {
        uploadedImgPos = { x: pos.x - mouseOffset.x, y: pos.y - mouseOffset.y };
    } else if (uploadedImgResizing) {
        var dx = pos.x - uploadedImgPos.x;
        var dy = pos.y - uploadedImgPos.y;
        var originalRatio = uploadedImg.width / uploadedImg.height;

        switch (resizeCorner) {
            case 'topLeft':
                uploadedImgSize.width -= dx;
                uploadedImgSize.height = uploadedImgSize.width / originalRatio;
                uploadedImgPos.x += dx;
                uploadedImgPos.y += dy;
                break;
            case 'topRight':
                uploadedImgSize.width = dx;
                uploadedImgSize.height = uploadedImgSize.width / originalRatio;
                uploadedImgPos.y += dy;
                break;
            case 'bottomLeft':
                uploadedImgSize.width -= dx;
                uploadedImgSize.height = uploadedImgSize.width / originalRatio;
                uploadedImgPos.x += dx;
                break;
            case 'bottomRight':
                uploadedImgSize.width = dx;
                uploadedImgSize.height = uploadedImgSize.width / originalRatio;
                break;
        }
    }
    draw();
});

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Draw the uploaded image 
    ctx.drawImage(uploadedImg, uploadedImgPos.x, uploadedImgPos.y, uploadedImgSize.width, uploadedImgSize.height);
    // Draw all pirate hats
    pirateHats.forEach(hat => {
        ctx.drawImage(hat.img, hat.pos.x, hat.pos.y, hat.size.width, hat.size.height);
        // Draw a rectangle around the pirate hat
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = 'grey';
        ctx.lineWidth = 2;
        ctx.strokeRect(hat.pos.x, hat.pos.y, hat.size.width, hat.size.height);
        // Draw resize handles
        ctx.fillStyle = 'blue';
        drawCircle(hat.pos.x, hat.pos.y); // Top left corner
        drawCircle(hat.pos.x + hat.size.width, hat.pos.y); // Top right corner
        drawCircle(hat.pos.x, hat.pos.y + hat.size.height); // Bottom left corner
        drawCircle(hat.pos.x + hat.size.width, hat.pos.y + hat.size.height); // Bottom right corner
    });
    // Draw the uploaded image resize handles
    drawCircle(uploadedImgPos.x, uploadedImgPos.y); // Top left corner
    drawCircle(uploadedImgPos.x + uploadedImgSize.width, uploadedImgPos.y); // Top right corner
    drawCircle(uploadedImgPos.x, uploadedImgPos.y + uploadedImgSize.height); // Bottom left corner
    drawCircle(uploadedImgPos.x + uploadedImgSize.width, uploadedImgPos.y + uploadedImgSize.height); // Bottom right corner
}

function drawCircle(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, 2 * Math.PI);
    ctx.fill();
}

function saveCanvas() {
    // Calculate the painted area
    var minX = Math.min(uploadedImgPos.x, ...pirateHats.map(hat => hat.pos.x));
    var minY = Math.min(uploadedImgPos.y, ...pirateHats.map(hat => hat.pos.y));
    var maxX = Math.max(uploadedImgPos.x + uploadedImgSize.width, ...pirateHats.map(hat => hat.pos.x + hat.size.width));
    var maxY = Math.max(uploadedImgPos.y + uploadedImgSize.height, ...pirateHats.map(hat => hat.pos.y + hat.size.height));

    // Create a new canvas and context
    var newCanvas = document.createElement('canvas');
    newCanvas.width = maxX - minX;
    newCanvas.height = maxY - minY;
    var newCtx = newCanvas.getContext('2d');

    // Draw the images on the new canvas
    newCtx.drawImage(uploadedImg, uploadedImgPos.x - minX, uploadedImgPos.y - minY, uploadedImgSize.width, uploadedImgSize.height);
    pirateHats.forEach(hat => {
        newCtx.drawImage(hat.img, hat.pos.x - minX, hat.pos.y - minY, hat.size.width, hat.size.height);
    });

    // Return the new canvas
    return newCanvas;
}

document.getElementById('save').addEventListener('click', function() {
    var newCanvas = saveCanvas();
    let link = document.createElement('a');
    link.download = 'image.png';
    link.href = newCanvas.toDataURL();
    document.body.appendChild(link); // Append the link to the body
    link.click();
    document.body.removeChild(link); // Remove the link from the body
    draw(); // Redraw the canvas with the selection outline and blue dots
});

</script>

</body>
</html>
